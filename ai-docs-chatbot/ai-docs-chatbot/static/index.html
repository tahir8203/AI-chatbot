<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Help Desk</title>
<style>
  :root { --bg:#f4f6f8; --panel:#fff; --ink:#18202b; --muted:#5d6876; --line:#dfe4ea;
          --accent:#1f5fbf; --accent-soft:#e6eefb; --bot:#f1f4f7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10151b; --panel:#171e26; --ink:#e4e8ec; --muted:#98a3af; --line:#26303b;
            --accent:#6ea3f5; --accent-soft:#1c2c45; --bot:#1d2530; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width:760px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
         padding:20px 16px; gap:14px; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { font-size:22px; margin:0; }
  .badge { font-size:12px; padding:3px 10px; border-radius:999px; background:var(--accent-soft);
           color:var(--accent); font-weight:600; }
  .sub { color:var(--muted); margin:0; font-size:14px; flex-basis:100%; }
  .chat { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:16px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; min-height:360px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .bot { align-self:flex-start; background:var(--bot); }
  .sources { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .src { font-size:12px; border:1px solid var(--line); border-radius:6px; padding:2px 8px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:999px;
          padding:6px 12px; font-size:13px; cursor:pointer; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
          background:var(--panel); color:var(--ink); font:inherit; }
  button[type=submit] { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff;
          font:600 15px system-ui, sans-serif; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Campus Help Desk</h1>
    <span class="badge" id="mode">Loading…</span>
    <p class="sub">Ask about admissions, fees, scholarships, exams or attendance. Answers come only from the institute's documents.</p>
  </header>
  <div class="chips" id="chips">
    <button class="chip" type="button">What is the attendance requirement?</button>
    <button class="chip" type="button">Can I pay the fee in installments?</button>
    <button class="chip" type="button">How do merit scholarships work?</button>
    <button class="chip" type="button">When do Fall admissions close?</button>
  </div>
  <div class="chat" id="chat" aria-live="polite">
    <div class="msg bot">Hi! I'm the help desk assistant. What would you like to know?</div>
  </div>
  <form id="form">
    <input id="q" autocomplete="off" placeholder="Type your question…" aria-label="Your question" maxlength="500">
    <button type="submit" id="send">Ask</button>
  </form>
</div>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('q');
const send = document.getElementById('send');

fetch('/api/health').then(r => r.json()).then(d => {
  document.getElementById('mode').textContent = d.mode === 'ai' ? 'AI mode' : 'Demo mode (no API key)';
}).catch(() => { document.getElementById('mode').textContent = 'Offline'; });

function add(text, cls, sources) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement('div');
    s.className = 'sources';
    sources.forEach(src => {
      const tag = document.createElement('span');
      tag.className = 'src';
      tag.textContent = src.section + ' · ' + src.file;
      s.appendChild(tag);
    });
    div.appendChild(s);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function ask(question) {
  add(question, 'user');
  send.disabled = true;
  try {
    const res = await fetch('/api/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Request failed');
    add(data.answer, 'bot', data.sources);
  } catch (err) {
    add('Sorry, something went wrong: ' + err.message, 'bot');
  } finally {
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const q = input.value.trim();
  if (q.length < 2) return;
  input.value = '';
  ask(q);
});
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (b) ask(b.textContent);
});
</script>
</body>
</html>
